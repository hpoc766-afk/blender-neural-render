schema_version = "1.0.0"
id = "neural_render_bridge"
version = "0.1.0"
name = "Neural Render Bridge"
tagline = "Process scene HDR before the original compositor"
maintainer = "Neural Render Bridge contributors"
type = "add-on"
tags = ["Render"]
blender_version_min = "5.1.0"
blender_version_max = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read models and write scene snapshots and render results"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "/.git/", "/.gitignore", "/dist/", "/*.zip"]
